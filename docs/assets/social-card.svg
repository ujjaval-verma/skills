<?xml version="1.0" encoding="UTF-8"?>
<!--
  GitHub social preview — 1280×640 (2:1), rendered at 2560×1280 (2× pixel density).
  All meaningful content kept inside a 40pt safe-area inset per GitHub's repo-card
  template (https://docs.github.com/.../customizing-your-repositorys-social-media-preview).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="2560" height="1280" font-family="'Inter', -apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif">
  <!-- ===== defs ===== -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b0f1d"/>
      <stop offset="55%"  stop-color="#10142a"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6f42c1"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="cardBlue"   x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1f6feb" stop-opacity=".22"/><stop offset="100%" stop-color="#1f6feb" stop-opacity=".05"/></linearGradient>
    <linearGradient id="cardPurple" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6f42c1" stop-opacity=".25"/><stop offset="100%" stop-color="#6f42c1" stop-opacity=".05"/></linearGradient>
    <linearGradient id="cardGreen"  x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a7f37" stop-opacity=".22"/><stop offset="100%" stop-color="#1a7f37" stop-opacity=".05"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0%"   stop-color="#6f42c1" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#6f42c1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <marker id="arrowSm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#bf8700" fill-opacity=".9"/>
    </marker>
  </defs>

  <!-- ===== background (full bleed) ===== -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <ellipse cx="640" cy="320" rx="520" ry="320" fill="url(#halo)"/>
  <line x1="0" y1="0.5" x2="1280" y2="0.5" stroke="url(#purpleAccent)" stroke-width="1" stroke-opacity=".6"/>

  <!-- ===== SAFE AREA: 40,40 → 1240,600 (1200×560) ===== -->

  <!-- top tag, centered -->
  <g transform="translate(640,72)">
    <line x1="-104" y1="0" x2="-86" y2="0" stroke="#6f42c1" stroke-width="2"/>
    <circle cx="-79" cy="0" r="3" fill="#1a7f37"/>
    <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="4" fill="#a78bfa">SLICE&#8201;·&#8201;DELIVERY</text>
  </g>

  <!-- headline, centered -->
  <g transform="translate(640,140)">
    <text text-anchor="middle" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      <tspan x="0" y="0">Ship one slice.</tspan>
      <tspan x="0" dy="64"><tspan fill="#a78bfa">Ship it </tspan><tspan fill="#1a7f37">right</tspan><tspan fill="#a78bfa">.</tspan></tspan>
    </text>
  </g>

  <!-- subhead, single line, centered -->
  <text x="640" y="290" text-anchor="middle" font-size="15" fill="#c9d1d9" opacity=".85">
    Tracer bullet · RED→GREEN→refactor scan · Ralph review · clean closeout — one PR, one concern, end-to-end every cycle.
  </text>

  <!-- ===== three pillar cards (row), inside safe area ===== -->
  <!-- card geometry: 360 × 130, gap 20; 3 cards = 1120 → x-start 80 -->
  <g transform="translate(80,330)">
    <!-- Velocity -->
    <g transform="translate(0,0)">
      <rect width="360" height="130" rx="16" fill="url(#cardBlue)" stroke="#1f6feb" stroke-opacity=".75" stroke-width="1.4"/>
      <rect x="130" y="-12" width="100" height="24" rx="12" fill="#1f6feb"/>
      <text x="180" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">VELOCITY</text>
      <g transform="translate(60,75)" stroke="#79b8ff" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <circle r="26" stroke-opacity=".55"/>
        <path d="M-5 -14 L5 -2 L-2 -2 L5 14 L-5 2 L2 2 Z" fill="#79b8ff" stroke="none"/>
      </g>
      <text x="115" y="58" font-size="16" font-weight="700" fill="#fff">Small, verifiable chunks</text>
      <text x="115" y="82" font-size="12" fill="#9ec5ff">Tracer bullet first</text>
      <text x="115" y="100" font-size="12" fill="#9ec5ff">One concern per commit</text>
    </g>
    <!-- Rigor -->
    <g transform="translate(380,0)">
      <rect width="360" height="130" rx="16" fill="url(#cardPurple)" stroke="#6f42c1" stroke-opacity=".8" stroke-width="1.4"/>
      <rect x="130" y="-12" width="100" height="24" rx="12" fill="#6f42c1"/>
      <text x="180" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">RIGOR</text>
      <g transform="translate(60,75)" stroke="#c8a8ff" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <circle r="26" stroke-opacity=".55"/>
        <circle cx="-3" cy="-3" r="8"/>
        <path d="M3 3 L13 13"/>
        <path d="M-14 14 L9 14"/>
      </g>
      <text x="115" y="58" font-size="16" font-weight="700" fill="#fff">Prove the change</text>
      <text x="115" y="82" font-size="12" fill="#d6c2ff">RED→GREEN→refactor</text>
      <text x="115" y="100" font-size="12" fill="#d6c2ff">Adversarial review</text>
    </g>
    <!-- Hygiene -->
    <g transform="translate(760,0)">
      <rect width="360" height="130" rx="16" fill="url(#cardGreen)" stroke="#1a7f37" stroke-opacity=".8" stroke-width="1.4"/>
      <rect x="130" y="-12" width="100" height="24" rx="12" fill="#1a7f37"/>
      <text x="180" y="5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">HYGIENE</text>
      <g transform="translate(60,75)" stroke="#7ee787" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <circle r="26" stroke-opacity=".55"/>
        <path d="M-11 11 L11 -11"/>
        <path d="M2 -14 L14 -2"/>
        <path d="M-14 2 L-2 14"/>
      </g>
      <text x="115" y="58" font-size="16" font-weight="700" fill="#fff">Keep repo operable</text>
      <text x="115" y="82" font-size="12" fill="#a8e6b3">Worktrees · closeout</text>
      <text x="115" y="100" font-size="12" fill="#a8e6b3">No TODOs in source</text>
    </g>
  </g>

  <!-- ===== slice lifecycle bar, inside safe area ===== -->
  <g transform="translate(80,495)">
    <rect width="1120" height="66" rx="33" fill="#0f1530" stroke="#30363d" stroke-width="1"/>
    <text x="22" y="20" font-size="9" font-weight="800" letter-spacing="2" fill="#a78bfa">SLICE LIFECYCLE</text>

    <g font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
      <g transform="translate(155,44)">
        <rect x="-54" y="-14" width="108" height="28" rx="14" fill="#1f6feb"/>
        <text y="4">Tracer bullet</text>
      </g>
      <g transform="translate(290,44)">
        <rect x="-28" y="-14" width="56" height="28" rx="14" fill="#6f42c1"/>
        <text y="4">RED</text>
      </g>
      <g transform="translate(395,44)">
        <rect x="-34" y="-14" width="68" height="28" rx="14" fill="#6f42c1"/>
        <text y="4">GREEN</text>
      </g>
      <g transform="translate(530,44)">
        <rect x="-54" y="-14" width="108" height="28" rx="14" fill="#6f42c1"/>
        <text y="4">Refactor scan</text>
      </g>
      <g transform="translate(700,44)">
        <rect x="-62" y="-14" width="124" height="28" rx="14" fill="#6f42c1" stroke="#a78bfa" stroke-dasharray="3 3"/>
        <text y="4">Ralph (adversarial)</text>
      </g>
      <g transform="translate(850,44)">
        <rect x="-34" y="-14" width="68" height="28" rx="14" fill="#1a7f37"/>
        <text y="4">Merge</text>
      </g>
      <g transform="translate(970,44)">
        <rect x="-44" y="-14" width="88" height="28" rx="14" fill="#1a7f37"/>
        <text y="4">Closeout</text>
      </g>
    </g>

    <!-- forward arrows -->
    <g stroke="#bf8700" stroke-width="1.8" fill="none" marker-end="url(#arrowSm)">
      <line x1="210" y1="44" x2="258" y2="44"/>
      <line x1="319" y1="44" x2="358" y2="44"/>
      <line x1="430" y1="44" x2="472" y2="44"/>
      <line x1="585" y1="44" x2="634" y2="44"/>
      <line x1="763" y1="44" x2="812" y2="44"/>
      <line x1="885" y1="44" x2="922" y2="44"/>
    </g>

    <!-- per-behavior loop: Refactor scan ↺ RED -->
    <path d="M 520 30 C 480 6 330 6 295 30" stroke="#bf8700" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrowSm)"/>
    <text x="410" y="14" text-anchor="middle" font-size="10" font-style="italic" fill="#e5b864">per behavior</text>
  </g>

  <!-- ===== footer, inside safe area ===== -->
  <g font-size="13" text-anchor="middle">
    <text x="640" y="580" fill="#c9d1d9">
      <tspan fill="#79b8ff" font-weight="700">Velocity</tspan>
      <tspan fill="#8b949e"> + </tspan>
      <tspan fill="#c8a8ff" font-weight="700">Rigor</tspan>
      <tspan fill="#8b949e"> + </tspan>
      <tspan fill="#7ee787" font-weight="700">Hygiene</tspan>
      <tspan fill="#8b949e"> = </tspan>
      <tspan fill="#ffffff" font-weight="700">trustworthy autonomy, one slice at a time.</tspan>
    </text>
    <text x="640" y="598" fill="#8b949e" font-size="11">
      github.com/ujjaval-verma/skills · <tspan fill="#a78bfa">engineering/slice-delivery</tspan>
    </text>
  </g>
</svg>
